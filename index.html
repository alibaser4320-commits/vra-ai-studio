<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VRA AI Studio</title><style>
*{box-sizing:border-box}body{margin:0;background:#090b15;color:#f7f7ff;font-family:Inter,Arial,sans-serif}header{padding:24px 7%;border-bottom:1px solid #24283b;display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:800;color:#b5a2ff}.tag{color:#a7abc4}main{max-width:900px;margin:70px auto;padding:0 20px}h1{font-size:clamp(38px,7vw,70px);margin:0 0 15px;line-height:1.05}h1 span{color:#ad8aff}p{color:#a7abc4;line-height:1.6}.panel{margin-top:40px;background:#15182a;border:1px solid #343854;border-radius:22px;padding:28px}label{display:block;margin:0 0 12px;font-weight:700}textarea,select{width:100%;background:#0d1020;color:white;border:1px solid #424662;border-radius:12px;padding:16px;font:inherit}textarea{height:150px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}button{width:100%;background:linear-gradient(100deg,#8d64ff,#cb69ff);color:white;font-size:17px;font-weight:800;border:0;border-radius:13px;padding:17px;cursor:pointer}button:hover{filter:brightness(1.1)}.result{margin-top:22px;padding:20px;border:1px dashed #555a7b;border-radius:13px;color:#bbc0d8;min-height:95px}footer{text-align:center;padding:40px;color:#777e9d;font-size:13px}@media(max-width:600px){.grid{grid-template-columns:1fr}main{margin:45px auto}}
</style></head><body><header><div class="logo">✦ VRA AI Studio</div><div class="tag">Create with imagination</div></header><main><h1>Hayal et.<br><span>Videoya dönüştür.</span></h1><p>Bir sahne tarif et, video ayarlarını seç. Gerçek AI video üretimi için güvenli bir sunucu bağlantısı eklenecek.</p><section class="panel"><label for="prompt">Video promptun</label><textarea id="prompt" placeholder="Örnek: Gece Tokyo sokaklarında ilerleyen siyah spor araba, sinematik ışıklar, yağmurlu atmosfer..."></textarea><div class="grid"><div><label for="duration">Süre</label><select id="duration"><option>5 saniye</option><option>10 saniye</option></select></div><div><label for="ratio">Format</label><select id="ratio"><option>16:9 Yatay</option><option>9:16 Dikey</option><option>1:1 Kare</option></select></div></div><button id="generate">✦ Generate Video</button><div class="result" id="result" role="status">Video önizlemesi burada görünecek.</div></section></main><footer>VRA AI Studio · AI video generator interface</footer><script>document.getElementById('generate').addEventListener('click',()=>{const p=document.getElementById('prompt').value.trim();document.getElementById('result').textContent=p?'Prompt hazır! Gerçek video oluşturmak için bir AI video API ve sunucu bağlantısı gerekiyor.':'Önce bir video promptu yaz.'})</script></body></html>
